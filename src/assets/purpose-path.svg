<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-purpose" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#0a2444"/>
      <stop offset="55%" stop-color="#051a35"/>
      <stop offset="100%" stop-color="#00132f"/>
    </linearGradient>
    <radialGradient id="glow-purpose" cx="70%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#ffb546" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffb546" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffb546" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12365f"/>
      <stop offset="100%" stop-color="#0a2444"/>
    </linearGradient>
    <linearGradient id="mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2a4e"/>
      <stop offset="100%" stop-color="#061c38"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-purpose)"/>
  <rect width="800" height="600" fill="url(#glow-purpose)"/>

  <!-- rising sun -->
  <circle cx="562" cy="150" r="64" fill="#ffb546" opacity="0.9"/>
  <circle cx="562" cy="150" r="64" fill="none" stroke="#fff3df" stroke-width="1.5" opacity="0.5"/>
  <g stroke="#ffb546" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="562" y1="46" x2="562" y2="20"/>
    <line x1="638" y1="74" x2="656" y2="56"/>
    <line x1="668" y1="150" x2="694" y2="150"/>
    <line x1="486" y1="74" x2="468" y2="56"/>
  </g>

  <!-- far mountains -->
  <path d="M0 360 L140 250 L230 330 L330 220 L430 340 L520 260 L620 350 L720 270 L800 360 L800 600 L0 600 Z" fill="url(#mtn-far)"/>
  <!-- near mountains -->
  <path d="M0 470 L120 380 L210 450 L320 350 L440 460 L560 380 L680 460 L800 400 L800 600 L0 600 Z" fill="url(#mtn-near)"/>

  <!-- winding path -->
  <path d="M400 600 C 380 520, 460 500, 440 440 C 420 380, 500 360, 480 300 C 465 255, 520 220, 545 190"
        fill="none" stroke="#fff3df" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.85"/>

  <!-- walking figure -->
  <g transform="translate(400,560)" opacity="0.92">
    <circle cx="0" cy="-46" r="9" fill="#f5f8ff"/>
    <path d="M0 -37 L0 -8 M0 -8 L-11 18 M0 -8 L11 12 M0 -30 L-16 -14 M0 -30 L15 -18"
          stroke="#f5f8ff" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
