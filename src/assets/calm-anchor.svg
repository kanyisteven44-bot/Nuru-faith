<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-calm" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0c2a4e"/>
      <stop offset="55%" stop-color="#061c38"/>
      <stop offset="100%" stop-color="#00132f"/>
    </linearGradient>
    <radialGradient id="glow-calm" cx="50%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#35d9ff" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#35d9ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-calm)"/>
  <rect width="800" height="600" fill="url(#glow-calm)"/>

  <!-- a small steady light above the storm -->
  <circle cx="400" cy="120" r="14" fill="#eafcff"/>
  <g stroke="#eafcff" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="400" y1="80" x2="400" y2="60"/>
    <line x1="440" y1="98" x2="456" y2="84"/>
    <line x1="360" y1="98" x2="344" y2="84"/>
  </g>

  <!-- anchor: steady, held -->
  <g stroke="#eafcff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <circle cx="400" cy="215" r="24" stroke-width="7"/>
    <line x1="400" y1="239" x2="400" y2="400"/>
    <line x1="340" y1="270" x2="460" y2="270"/>
    <path d="M320 340 C 320 400, 370 420, 400 400"/>
    <path d="M480 340 C 480 400, 430 420, 400 400"/>
  </g>

  <!-- calm waves beneath, storm settled -->
  <g fill="none" stroke="#35d9ff" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M120 470 C 190 450, 250 490, 320 470 C 390 450, 450 490, 520 470 C 590 450, 650 490, 720 470"/>
  </g>
  <g fill="none" stroke="#eafcff" stroke-width="4" stroke-linecap="round" opacity="0.3">
    <path d="M90 520 C 170 498, 240 540, 320 518 C 400 496, 470 540, 550 518 C 620 498, 680 536, 740 520"/>
  </g>
</svg>
