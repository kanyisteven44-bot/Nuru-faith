<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-rel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3a1230"/>
      <stop offset="55%" stop-color="#1c0e2e"/>
      <stop offset="100%" stop-color="#00132f"/>
    </linearGradient>
    <radialGradient id="glow-rel" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#f257a7" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f257a7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f257a7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-rel)"/>
  <rect width="800" height="600" fill="url(#glow-rel)"/>

  <!-- two overlapping rings representing two lives drawing close -->
  <circle cx="345" cy="300" r="130" fill="none" stroke="#ffd7ec" stroke-width="5" opacity="0.55"/>
  <circle cx="455" cy="300" r="130" fill="none" stroke="#ffd7ec" stroke-width="5" opacity="0.55"/>
  <circle cx="345" cy="300" r="130" fill="#f257a7" opacity="0.06"/>
  <circle cx="455" cy="300" r="130" fill="#f257a7" opacity="0.06"/>

  <!-- heart at the overlap: what forms in shared space -->
  <g transform="translate(400,300)">
    <path d="M0 34 C -46 0, -46 -46, -14 -46 C 2 -46, 0 -30, 0 -22 C 0 -30, -2 -46, 14 -46 C 46 -46, 46 0, 0 34 Z"
          fill="#ffe3f1" opacity="0.95"/>
  </g>

  <!-- two small figures anchoring the rings, gentle presence -->
  <g fill="#ffd7ec" opacity="0.85">
    <circle cx="345" cy="430" r="9"/>
    <path d="M345 442 L345 470 M345 452 L332 466 M345 452 L358 466" stroke="#ffd7ec" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="455" cy="430" r="9"/>
    <path d="M455 442 L455 470 M455 452 L442 466 M455 452 L468 466" stroke="#ffd7ec" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
