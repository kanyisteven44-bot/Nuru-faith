name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  browser-public:
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/public-browser-audit-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Chromium and dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise live public Nuru in mobile and desktop browsers
        env:
          NURU_QA_BASE: https://nurufaith.co.ke
          NURU_QA_EMAIL: ${{ secrets.NURU_QA_EMAIL }}
          NURU_QA_PASSWORD: ${{ secrets.NURU_QA_PASSWORD }}
        run: node scripts/audit-live-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuru-browser-audit
          path: browser-qa/
          if-no-files-found: warn
          retention-days: 1
