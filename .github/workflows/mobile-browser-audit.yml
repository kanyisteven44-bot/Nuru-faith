name: Nuru mobile browser audit

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/mobile-browser-audit.yml"
      - "scripts/audit-live-mobile.mjs"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "23 3 * * *" # Daily at 06:23 East Africa Time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.55.0 lighthouse@12
          npx playwright install --with-deps chromium
      - name: Browse live Nuru pages at phone and desktop widths
        env:
          NURU_QA_BASE: https://nurufaith.co.ke
          NURU_QA_EMAIL: ${{ secrets.NURU_QA_EMAIL }}
          NURU_QA_PASSWORD: ${{ secrets.NURU_QA_PASSWORD }}
        run: node scripts/audit-live-mobile.mjs
      - name: Measure throttled mobile Lighthouse quality
        if: always()
        continue-on-error: true
        run: |
          mkdir -p browser-qa
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lighthouse https://nurufaith.co.ke/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=browser-qa/lighthouse-mobile.json --quiet
          node scripts/report-lighthouse.mjs
      - name: Preserve report and public page screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuru-public-browser-audit
          path: browser-qa
          if-no-files-found: warn
          retention-days: 1
          overwrite: true
