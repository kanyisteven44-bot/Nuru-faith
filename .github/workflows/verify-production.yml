name: Verify production build

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to verify
        required: false
        default: https://nuru-faith-vortiqora.vercel.app
  # Runs after a merge reaches main, never on a feature branch: before the
  # merge the deployment cannot carry the change yet, so it would always fail.
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check deployed bundle for merged UI
        run: node scripts/verify-production-build.mjs "${{ inputs.base_url || 'https://nuru-faith-vortiqora.vercel.app' }}"
